name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update Dependencies
        run: moon update

      - name: Check code formatting
        run: |
          moon fmt
          moon fmt --check

      - name: Type check
        run: moon check

      - name: Run test suite
        run: moon test

      - name: Build WebAssembly (wasm-gc)
        run: moon build --target wasm-gc
